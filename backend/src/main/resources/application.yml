spring:
  datasource:
    hikari:
      maximum-pool-size: 5
    url: jdbc:h2:file:${user.home}/deepstudy/deepstudy;AUTO_SERVER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  ai:
    planner-timeout-ms: 120000
    max-chat-history: 6
  audio:
    storage-dir: ${user.home}/deepstudy/audio

management:
  endpoints:
    web:
      exposure:
        include: health,info
